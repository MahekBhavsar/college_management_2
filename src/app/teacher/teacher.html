<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-3">
    <div>
      <h2 class="fw-bold text-dark mb-0">Teacher Data</h2>
      <p class="text-muted small mb-0">Manage and update faculty information</p>
    </div>
    
    <button class="btn btn-primary shadow-sm d-flex align-items-center gap-2 px-4 py-2" 
            style="background-color: #4e73df; border: none;"
            data-bs-toggle="modal" 
            data-bs-target="#teacherModal" 
            (click)="editTeacher.set(null)">
      <i class="bi bi-plus-lg"></i> 
      <span class="fw-semibold">Add New Teacher</span>
    </button>
  </div>

  <app-table 
    [data]="teachers()" 
    (edit)="edit($event)" 
    (remove)="deleteTeacher($event)">
  </app-table>

  <div class="modal fade common-modal-class" id="teacherModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-dark text-white border-0">
          <h5 class="modal-title d-flex align-items-center gap-2">
            <i class="bi {{ editTeacher() ? 'bi-pencil-square' : 'bi-plus-circle' }}"></i>
            {{ editTeacher() ? 'Modify' : 'Register' }} Teacher
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <app-forms 
            [editData]="editTeacher()" 
            (added)="addTeacher($event)" 
            (updated)="updateTeacher($event)">
          </app-forms>
        </div>
      </div>
    </div> 
  </div>
</div>
