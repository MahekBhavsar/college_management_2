<div class="container mt-5">
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body d-flex justify-content-between align-items-center bg-white rounded">
      <div>
        <h4 class="mb-0 fw-bold text-primary">Student Management</h4>
        <p class="text-muted small mb-0">Manage, edit, or remove student records</p>
      </div>
      <button class="btn btn-primary shadow-sm d-flex align-items-center gap-2 px-4 py-2" 
              data-bs-toggle="modal" 
              data-bs-target="#studentModal" 
              (click)="editStudent = null">
        <i class="bi bi-plus-lg"></i>
        ADD STUDENT
      </button>
    </div>
  </div>
<app-table 
  [data]="students$" 
  (edit)="edit($event)" 
  (remove)="deleteStudent($event)">
</app-table>
  <div class="modal fade common-modal-class" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"> <div class="modal-content border-0 shadow-lg">
        <div class="modal-header bg-light border-bottom-0 py-3">
          <h5 class="modal-title d-flex align-items-center fw-bold">
            <i class="bi" [class]="editStudent ? 'bi-pencil-square text-warning' : 'bi-person-plus text-primary'"></i>
            <span class="ms-2">{{ editStudent ? 'Edit' : 'Add' }} Student Details</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <app-forms [editData]="editStudent" (added)="addStudent($event)" (updated)="updateStudent($event)"></app-forms>
        </div>
      </div>
    </div>
  </div>
</div>
